<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Page Not Found - Meji's Website!!</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Outfit:wght@100..900&display=swap"
			rel="stylesheet"
		/>

		<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="favicon.svg" />
		<link rel="shortcut icon" href="favicon.ico" />

		<link rel="stylesheet" href="styles/styles.css" />

		<style>
			body {
				display: grid;
				place-items: center;
				min-height: 100vh;
				text-align: center;
				padding: 1rem;
				background-color: var(--color-bg);
			}

			.error-container {
				max-width: 600px;
				margin-inline: auto;
			}

			h1 {
				font-size: clamp(3rem, 10vw, 6rem);
				color: var(--color-primary-dark);
				margin-bottom: var(--space-xs);
			}

			p {
				font-size: var(--font-size-lg);
				margin-bottom: var(--space-lg);
			}

			.btn {
				background-color: var(--color-primary);
				color: var(--color-bg);
				border-radius: var(--space-lg);
				padding-block: clamp(var(--space-xs), 2vw, var(--space-sm));
				padding-inline: clamp(var(--space-md), 4vw, var(--space-lg));
				text-decoration: none;
				font-weight: 600;
				font-family: var(--font-heading);
				font-size: var(--font-size-base);
				transition: all var(--transition-fast);
				box-shadow: 0 4px 0 var(--color-primary-dark);
				cursor: pointer;
			}

			.btn:hover {
				transform: translateY(-2px);
				box-shadow: 0 6px 0 var(--color-primary-dark);
			}

			.btn:active {
				transform: translateY(2px);
				box-shadow: 0 0 0 var(--color-primary-dark);
			}
		</style>
	</head>

	<body class="[ ff-body text-default bg-bg ]">
		<div class="error-container flow">
			<h1 class="ff-heading">404</h1>
			<p>
				Oops! Looks like this page got lost in the void<br />(or eaten by a
				cat).
			</p>
			<a href="/" class="btn">Return Home</a>
		</div>

		<script
			src="./vendor/oneko.js/oneko.js"
			data-cat="./vendor/oneko.js/oneko.gif"
			defer
		></script>
	</body>
</html>
